<!DOCTYPE html>

<html lang="en">
    <head>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
        <link href="styles.css" rel="stylesheet">
        <title>Trivia!</title>
    </head>
    <body>
        <div class="header">
            <h1>Trivia!</h1>
        </div>

        <div class="container">
            <div class="section">
                <h2>Part 1: Multiple Choice </h2>
                <hr>
                <!-- TODO: Add multiple choice question here -->
                <h3> What's the capital of singapore? </h3>
                <button id="button1" >CityHall</button>
                <button id="button2" >Marinabay</button>
                <button id="button3" >It dose not have a capital </button>
                <p id ="result"> </p>

            </div>

            <div class="section">
                <h2>Part 2: Free Response</h2>
                <hr>
                <!-- TODO: Add free response question here -->
                <h3>What is 10x10? </h3>
                <input id = "answer"> </input>
                <button id="button4" >Check Answer</button>
                <p id ="result2"> </p>

            </div>
        </div>
        <script>
            // TODO: Add code to check answers to questions
            document.querySelector('#button1').onclick = function(){
                document.querySelector('#button1').style.backgroundColor = 'red';
                document.querySelector('#result').innerHTML = "Incorrect";
            };
            document.querySelector('#button2').onclick = function(){
                document.querySelector('#button2').style.backgroundColor = 'red';
                document.querySelector('#result').innerHTML = "Incorrect";
            };
            document.querySelector('#button3').onclick = function(){
                document.querySelector('#button3').style.backgroundColor = 'green';
                document.querySelector('#result').innerHTML = "Correct!";
            };

            let user_input = 0;

            document.querySelector('#button4').onclick = function(){
                user_input = document.querySelector('#answer').value;

                if (user_input === '100'){
                    document.querySelector('#result2').innerHTML = "Correct!";
                    document.querySelector('#answer').style.backgroundColor = 'green';

                }else{
                    document.querySelector('#result2').innerHTML = "Incorrect";
                    document.querySelector('#answer').style.backgroundColor = 'red';
                }
            };

        </script>
    </body>
</html>
