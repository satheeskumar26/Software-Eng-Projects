{% extends "layout.html" %}

{% block title %}
    Create Quiz
{% endblock %}

{% block main %}
<div class="container mt-5">
    <form method="POST" action="/create_quiz">

        <h2 class="text-primary fw-bold mb-4">Create A New Quiz</h2>

        <!-- Quiz Name -->
        <div class="fw-semibold mb-3">
            <label for="quizName" class="form-label" style="text-align: left; display: block;">Quiz Name :</label>
            <input type="text" class="form-control" id="quizName" name="quizName" placeholder="Enter quiz name" value="{{ quiz_name }}" required>
        </div>


        <!-- Quiz Description -->
        <div class="fw-semibold mb-3">
            <label for="quizDescription" class="form-label" style="text-align: left; display: block;">Quiz Description :</label>
            <textarea class="form-control" id="quizDescription" name="quizDescription" rows="3" placeholder="Enter quiz description" required>{{ quiz_description }}</textarea>
        </div>

        <!-- Hidden Counter -->
        <input type="hidden" name="counter" value="{{ counter }}">

        <!-- Questions Section -->
        <div class="fw-semibold mt-4">
            <h5>-- Questions --</h5>
        </div>


        {% for number in range(counter) %}

            <div class="fw-semibold mb-5">
                <div class="fw-semibold mb-3">
                    <label for="question"  class="form-label" style="text-align: left; display: block;">Question :</label>
                    <input type="text" class="form-control" name="question{{ number }}" placeholder="Enter question" value="{{ questions[number].text if questions|length > number else '' }}" required>
                </div>

                <div class="fw-semibold mb-3">
                    <label for="question" class="form-label" style="text-align: left; display: block;">Awnser :</label>
                </div>

                {% for i in range(4) %}
                <div class="d-flex mb-2">
                    <input type="text" required class="form-control me-2" name="choice{{ number }}_{{ i }}" placeholder="Enter choice" style="width: 50%;" value="{{ questions[number].choices[i] if questions|length > number and questions[number].choices|length > i else '' }}">
                    <input type="radio" name="correctChoice{{ number }}" required class="form-check-input me-2" value="{{ i }}" {% if questions|length > number and questions[number].correct == i|string %}checked{% endif %}>
                </div>
                {% endfor %}
            </div>

        {% endfor %}


        <!-- Add Multiple Choice Question Button -->
        <div class="mt-3">
            <button type="submit" name="action" value="add" class="btn btn-success w-25 mb-4">Add</button>
            <button type="submit" name="action" value="remove" class="btn btn-danger w-25 mb-4">Remove</button>
        </div>

        <!-- Create Quiz Button -->
        <div>
        <button type="submit" name="action" value="submit" class="btn btn-primary" id="createQuizBtn">Create Quiz</button>
        </div>
    </form>

</div>



{% endblock %}
