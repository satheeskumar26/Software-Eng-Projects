{% extends "layout.html" %}

{% block title %}
    Quote
{% endblock %}

{% block main %}

<div class="section">
    <h2> Buy Info </h2>
</div>

<div class="section">
    <form action="/buy" method="post">
        <table>
            <thead>
                <tr>
                    <th style="text-align: center; width: 50%;">Symbol</th>
                    <th style="text-align: center; width: 50%;">Shares</th>
                </tr>
            </thead>

                <tbody>
                    <tr>
                        <td><input name="symbol" type="text" placeholder="Symbol" required></td>
                        <td><input name="shares" type="text" placeholder="Num" style="text-align: center; width: 50px;"></td>
                    </tr>
                </tbody>

        </table>

        <div class="section">

            <input type="hidden" name="state" value="False">
            <button type="submit" name="buy" value="True">Buy</button>

        </div>
    </form>
</div>


{% endblock %}
