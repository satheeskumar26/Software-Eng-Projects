<!DOCTYPE html>

<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
        <link href="styles.css" rel="stylesheet">
        <title>My Webpage</title>
    </head>
    <body>
        <!-- header -->
        <div class="header">
            <nav>
                <div class="nav-links">
                    <ul>
                        <li> <a href="index.html"> HOME </a> </li>
                        <li> <a href="about.html"> ABOUT ME </a> </li>
                        <li> <a href="resume.html"> RESUME </a> </li>
                        <li> <a href="contect.html"> CONTACT </a> </li>
                    </ul>

                </div>
            </nav>
        </div>
        <!-- Form -->
        <main class="container2 mt-5">
            <h1>Contact Me!</h1>
            <form class="row g-3">

                <div class="col-md-6">
                    <label for="firstName" class="form-label"> First Name </label>
                    <input type="text" class="form-control w-100" id="firstName" required>
                </div>

                <div class="col-md-6">
                    <label for="lastName" class="form-label"> Last Name </label>
                    <input type="text" class="form-control w-100" id="lastName" required>
                </div>

                <div class="col-md-6">
                    <label for="emailInfo" class="form-label"> E-mail </label>
                    <input type="email" class="form-control " id="emailInfo" required>
                </div>

                <div class="col-md-6">
                    <label for="phoneNumber" class="form-label"> Phone Number </label>
                    <input type="text" class="form-control " id="phoneNumber" placeholder="+1 (415) 867-5309">
                </div>

                <div class="col-md-12">
                    <label for="comments" class="form-label"> Comments, Questions? </label>
                    <textarea class="form-control" id="comments " row="3" required></textarea>
                </div>

                <div class="col-md-12">
                    <button type="submit" class="btn-primary"> Submit </button>
                </div>

            </form>

        </main>

        <script>
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-gtEjrD/SeCtmISkjkN... crossorigin="anonymous">

        </script>
    </body>
</html>
